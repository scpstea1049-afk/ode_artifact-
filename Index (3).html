    <script>
        /* -------------------------------------------------------------------------- */
        /*                          1. 音效系統 (Web Audio API)                         */
        /* -------------------------------------------------------------------------- */
        let soundEnabled = true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.setValueAtTime(164.81, now + 0.15); // E3
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        /* -------------------------------------------------------------------------- */
        /*                          2. 遊戲資料庫 (試卷題庫轉換)                         */
        /* -------------------------------------------------------------------------- */
        const STAGES = [
            {
                id: 1,
                name: "植物王國秘密",
                icon: "fa-seedling",
                color: "emerald",
                bgGradient: "from-emerald-500 to-teal-600",
                description: "探討植物根、莖、葉、花、果實與種子的奧祕！",
                questions: [
                    {
                        type: "tf",

            const progress = ((gameState.currentQuestionIdx) / stage.questions.length) * 100;

                // 是非題 (O/X)
                optsContainer.className = "grid grid-cols-2 gap-4";

                const btnO = createOptionButton("⭕ 正確 (對)", () => checkAnswer(true));
                const btnX = createOptionButton("❌ 錯誤 (錯)", () => checkAnswer(false));

                optsContainer.appendChild(btnO);
                optsContainer.appendChild(btnX);
            } else {
                // 四選一選擇題
                optsContainer.className = "grid grid-cols-1 sm:grid-cols-2 gap-3.5";

                q.options.forEach((optText, optIdx) => {
                    const prefix = ["① ", "② ", "③ ", "④ "][optIdx] || "";
                    const btn = createOptionButton(prefix + optText, () => checkAnswer(optIdx));
                    optsContainer.appendChild(btn);
                });
            }

            updateHeader();
        }

        // 建立選項按鈕
        function createOptionButton(text, onClickHandler) {
            const btn = document.createElement('button');
            btn.className = "btn-bounce w-full p-4 bg-slate-50 hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-400 rounded-2xl font-bold text-left text-slate-700 hover:text-emerald-800 transition flex items-center justify-between group";
            btn.innerHTML = `
                <span>${text}</span>
                <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-emerald-500 transition"></i>
            `;
            btn.onclick = onClickHandler;
            return btn;
        }

        // 檢查答案
        function checkAnswer(userChoice) {
            const stage = STAGES[gameState.currentStageIdx];
            const q = stage.questions[gameState.currentQuestionIdx];

            let isCorrect = false;
            if (q.type === 'tf') {
                isCorrect = (userChoice === q.answer);
            } else {
                isCorrect = (userChoice === q.answer);
            }

            gameState.totalAnswered++;

            // 紀錄歷程
            gameState.userAnswersHistory.push({
                question: q.question,
                isCorrect: isCorrect,
                rationale: q.rationale,
                stageName: stage.name
            });

            if (isCorrect) {
                playSound('correct');
                gameState.score += 20;
                gameState.totalCorrect++;
                showFeedbackModal(true, "答對了！太棒了！", q.rationale);
            } else {
                playSound('wrong');
                gameState.lives = Math.max(0, gameState.lives - 1);
                showFeedbackModal(false, "差一點點！再接再厲！", q.rationale);

                if (gameState.lives === 0) {
                    // 生命值用盡
                    setTimeout(() => {
                        alert("生命值耗盡！別灰心，讓我們重新補充能量再出發！");
                        gameState.lives = 3;
                        showMapScreen();
                    }, 1200);
                }
            }
        }

        // 顯示解說 Modal
        function showFeedbackModal(isCorrect, title, desc) {
            const modal = document.getElementById('feedback-modal');
            const icon = document.getElementById('feedback-icon');
            const titleEl = document.getElementById('feedback-title');
            const descEl = document.getElementById('feedback-desc');

            if (isCorrect) {
                icon.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-emerald-100 text-emerald-600";
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                titleEl.className = "text-2xl font-black mb-2 text-emerald-600";
            } else {
                icon.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 bg-rose-100 text-rose-500";
                icon.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                titleEl.className = "text-2xl font-black mb-2 text-rose-600";
            }

            titleEl.innerText = title;
            descEl.innerText = desc;
            modal.classList.remove('hidden');
        }

        // 切換至下一題
        function nextQuestion() {
            document.getElementById('feedback-modal').classList.add('hidden');
            const stage = STAGES[gameState.currentStageIdx];
            gameState.currentQuestionIdx++;

            if (gameState.currentQuestionIdx < stage.questions.length) {
                loadQuestion();
            } else {
                // 完成該關卡
                playSound('win');
                if (gameState.currentStageIdx + 1 < STAGES.length) {
                    gameState.unlockedStages[gameState.currentStageIdx + 1] = true;
                }
                
                if (gameState.currentStageIdx === STAGES.length - 1) {
                    // 全關卡完畢
                    showResultScreen();
                } else {
                    alert(`🎉 恭喜通過「${stage.name}」！下一關卡已成功解鎖！`);
                    showMapScreen();
                }
            }
        }

        // 結算畫面
        function showResultScreen() {
            hideAllViews();
            document.getElementById('view-result').classList.remove('hidden');

            document.getElementById('result-player-name').innerText = `探險家：${gameState.studentName}`;
            document.getElementById('final-score').innerText = gameState.score;
            
            const accuracy = Math.round((gameState.totalCorrect / Math.max(1, gameState.totalAnswered)) * 100);
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;

            let badge = "自然小探險家";
            let badgeIcon = "fa-medal";
            if (accuracy >= 90) {
                badge = "🏆 自然科學大博士";
                badgeIcon = "fa-trophy";
            } else if (accuracy >= 70) {
                badge = "🌟 頂尖科學探險家";
                badgeIcon = "fa-star";
            } else {
                badge = "🌱 熱血實習觀察員";
                badgeIcon = "fa-seedling";
            }

            document.getElementById('final-badge').innerText = badge;
            document.getElementById('result-badge-icon').className = `fa-solid ${badgeIcon}`;

            // 自動上傳成績至 Google 試算表
            uploadScoreToGoogleSheet(accuracy, badge);
        }

        // 上傳數據至 Google 試算表
        function uploadScoreToGoogleSheet(accuracy, badge) {
            const syncBox = document.getElementById('sync-status-box');
            const syncIcon = document.getElementById('sync-icon');
            const syncText = document.getElementById('sync-text');

            syncBox.classList.remove('hidden');

            if (!gasApiUrl) {
                syncBox.className = "mt-4 p-3 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 text-xs font-bold text-center";
                syncIcon.className = "fa-solid fa-triangle-exclamation text-amber-500 mr-1";
                syncText.innerText = "尚未設定 Google 試算表 Web App 網址（可由教師專區設定）。";
                return;
            }

            syncBox.className = "mt-4 p-3 rounded-xl border border-blue-200 bg-blue-50 text-blue-800 text-xs font-bold text-center";
            syncIcon.className = "fa-solid fa-spinner fa-spin text-blue-500 mr-1";
            syncText.innerText = "正在將成績同步上傳至 Google 試算表...";

            const payload = {
                studentName: gameState.studentName,
                score: gameState.score,
                accuracy: accuracy,
                badge: badge,
                timestamp: new Date().toISOString()
            };

            fetch(gasApiUrl, {
                method: 'POST',
                mode: 'no-cors', // 避開跨網域限制
                headers: {
                    'Content-Type': 'text/plain'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                syncBox.className = "mt-4 p-3 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs font-bold text-center";
                syncIcon.className = "fa-solid fa-circle-check text-emerald-500 mr-1";
                syncText.innerText = "🎉 成績與紀錄已成功上傳至 Google 試算表！";
            }).catch(err => {
                syncBox.className = "mt-4 p-3 rounded-xl border border-rose-200 bg-rose-50 text-rose-800 text-xs font-bold text-center";
                syncIcon.className = "fa-solid fa-circle-xmark text-rose-500 mr-1";
                syncText.innerText = "連線傳送失敗，請檢查網路或 API 設定。";
            });
        }

        // 顯示錯題與總複習筆記
        function showReviewScreen() {
            hideAllViews();
            document.getElementById('view-review').classList.remove('hidden');

            const container = document.getElementById('review-list');
            container.innerHTML = '';

            let count = 1;
            STAGES.forEach(stage => {
                stage.questions.forEach(q => {
                    const item = document.createElement('div');
                    item.className = "p-4 bg-white border-2 border-slate-200 rounded-2xl shadow-sm";
                    
                    let ansStr = "";
                    if (q.type === 'tf') {
                        ansStr = q.answer ? "⭕ 正確" : "❌ 錯誤";
                    } else {
                        ansStr = `選 ${["①","②","③","④"][q.answer]}：${q.options[q.answer]}`;
                    }

                    item.innerHTML = `
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold">第 ${count++} 題</span>
                            <span class="text-xs text-slate-400 font-bold">${stage.name} - ${q.tag}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base mb-2">${q.question}</h4>
                        <div class="text-xs font-bold text-emerald-700 bg-emerald-50 p-2 rounded-lg mb-2">
                            【正確答案】：${ansStr}
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            💡 觀念解析：${q.rationale}
                        </p>
                    `;
                    container.appendChild(item);
                });
            });
        }

        // 重新開始
        function restartGame() {
            gameState = {
                currentStageIdx: 0,
                currentQuestionIdx: 0,
                lives: 3,
                score: 0,
                totalCorrect: 0,
                totalAnswered: 0,
                unlockedStages: [true, false, false, false, false],
                userAnswersHistory: []
            };
            showMapScreen();
        }

        // 隱藏所有視圖
        function hideAllViews() {
            ['view-start', 'view-map', 'view-question', 'view-result', 'view-review'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        /* -------------------------------------------------------------------------- */
        /*                          5. 首頁吉祥物對話動畫系統                          */
        /* -------------------------------------------------------------------------- */
        const DIALOGUES = [
            "哈囉！我是探險隊長綠綠博士！歡迎來到自然科學冒險樂園！ 🚀",
            "這次任務包含植物、磁鐵、力與水能等 5 大關卡，考驗你的科學實力！ 🌱🧲",
            "請在下方輸入你的姓名，點擊「開始探險闖關」和我一起出發吧！ ⚡"
        ];
        let currentDialogueIdx = 0;
        let typingTimeout = null;
        let isTyping = false;

        function startDialogueAnimation() {
            showDialogue(0);
        }

        function showDialogue(idx) {
            if (typingTimeout) clearTimeout(typingTimeout);
            
            currentDialogueIdx = idx % DIALOGUES.length;
            const text = DIALOGUES[currentDialogueIdx];
            const textEl = document.getElementById('mascot-dialogue-text');
            const counterEl = document.getElementById('dialogue-counter');

            if (!textEl) return;

            counterEl.innerText = `${currentDialogueIdx + 1} / ${DIALOGUES.length}`;
            textEl.innerHTML = '';
            textEl.classList.add('typing-cursor');

            let charIdx = 0;
            isTyping = true;

            function typeNextChar() {
                if (charIdx < text.length) {
                    textEl.innerHTML = text.substring(0, charIdx + 1);
                    charIdx++;
                    typingTimeout = setTimeout(typeNextChar, 35);
                } else {
                    isTyping = false;
                    textEl.classList.remove('typing-cursor');
                    // 停留 4 秒後自動輪播下一句
                    typingTimeout = setTimeout(() => {
                        showDialogue(currentDialogueIdx + 1);
                    }, 4000);
                }
            }

            typeNextChar();
        }

        function triggerMascotSpeak() {
            playSound('correct');
            // 若還在打字中，點擊直接顯示全文；否則切換至下一句
            if (isTyping) {
                if (typingTimeout) clearTimeout(typingTimeout);
                const textEl = document.getElementById('mascot-dialogue-text');
                textEl.innerText = DIALOGUES[currentDialogueIdx];
                textEl.classList.remove('typing-cursor');
                isTyping = false;
                typingTimeout = setTimeout(() => {
                    showDialogue(currentDialogueIdx + 1);
                }, 4000);
            } else {
                showDialogue(currentDialogueIdx + 1);
            }
        }

        // 頁面載入時自動初始化對話
        window.onload = function() {
            startDialogueAnimation();
        };

        // 更新頂部資訊列
        function updateHeader() {
            document.getElementById('player-name-display').innerText = gameState.studentName;
            document.getElementById('score-text').innerText = gameState.score;
            
            const livesContainer = document.getElementById('lives-container');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < gameState.lives) {
                    livesContainer.innerHTML += '<i class="fa-solid fa-heart animate-bounce"></i>';
                } else {
                    livesContainer.innerHTML += '<i class="fa-regular fa-heart opacity-40"></i>';
                }
            }
        }
    </script>
</body>
</html>
